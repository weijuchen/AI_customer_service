services:
  # API Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-customer-service-api
    environment:
      # Sets the OpenAI API Key from the host environment
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      # Mounts models and data (':ro' for read-only access, enhancing security)
      - ./models:/app/models:ro
      - ./faq_data:/app/faq_data:ro
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s # Gives the API 40 seconds to start up
    # restart: unless-stopped
    networks:
      - ai-network

  # Streamlit Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: ai-customer-service-frontend
    environment:
      # The internal URL of the API service
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        # Waits for the API service to become healthy before starting the frontend
        condition: service_healthy 
    restart: unless-stopped
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge